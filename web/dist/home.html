<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Family — Hearth</title>
<link rel="stylesheet" href="/css/app.css" />
<style>
  .greeting { font-size: 13px; color: var(--muted); margin-bottom: 4px; }

  /* Child summary cards */
  .child-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 1100px) { .child-grid { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 640px) { .child-grid { grid-template-columns: 1fr; } }

  .child-card { padding: 22px; display: flex; flex-direction: column; gap: 16px; text-decoration: none; color: inherit; transition: border-color 0.15s; }
  .child-card:hover { text-decoration: none; border-color: var(--border-strong); }
  .child-card .child-head { display: flex; align-items: center; gap: 14px; }
  .child-card .child-meta { display: flex; flex-direction: column; gap: 2px; }
  .child-card h3 { font-size: 18px; }
  .child-card .child-meta .subtitle { font-size: 12.5px; color: var(--muted); }
  .child-card .usage { display: flex; flex-direction: column; gap: 8px; }
  .child-card .usage-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
  .child-card .usage-row .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 14px; }
  .child-card .usage-row .label { color: var(--muted); font-size: 12px; }
  .child-card .device-strip {
    display: flex; gap: 4px; flex-wrap: wrap;
    padding-top: 12px; border-top: 1px solid var(--border);
  }
  .device-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 8px;
    background: var(--surface-2);
    border-radius: 7px;
    font-size: 11.5px;
    color: var(--muted);
    border: 1px solid transparent;
  }
  .device-chip .ddot { width: 5px; height: 5px; border-radius: 50%; background: var(--ok); }
  .device-chip.away .ddot { background: var(--muted-2); }
  .device-chip.gap .ddot { background: var(--warn); }
  .device-chip.paused .ddot { background: var(--info); }

  /* Discovered section */
  .discovered {
    margin-top: 36px;
  }
  .discovered-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .discovered-head h2 { font-size: 16px; }
  .discovered-head .muted { font-size: 12.5px; }

  .discovered-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 900px) { .discovered-list { grid-template-columns: 1fr; } }
  .discovered-row {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px dashed var(--border-strong);
    border-radius: var(--r-md);
  }
  .discovered-row .d-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: var(--surface-2);
    display: grid; place-items: center;
    color: var(--muted);
  }
  .discovered-row .d-text { flex: 1; min-width: 0; }
  .discovered-row .d-text strong { font-size: 14px; font-weight: 600; display: block; }
  .discovered-row .d-text .sub {
    color: var(--muted); font-size: 12px;
    display: flex; gap: 8px; align-items: center; margin-top: 2px;
  }
  .discovered-row .d-text .sub .mac { font-family: var(--font-mono); }

  /* Today summary strip */
  .today {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    overflow: hidden;
    margin-bottom: 28px;
  }
  @media (max-width: 720px) { .today { grid-template-columns: 1fr 1fr; } }
  .today > div {
    background: var(--surface);
    padding: 16px 20px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .today .label { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
  .today .value { font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .today .sub { font-size: 12px; color: var(--muted); }

  .quick-link {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--accent-ink); font-size: 13px; font-weight: 500;
    text-decoration: none;
  }
  .quick-link:hover { text-decoration: underline; text-underline-offset: 3px; }
  .quick-link svg { width: 14px; height: 14px; }
</style>
  <link rel="icon" type="image/png" href="/img/logo.png" />
</head>
<body>
<div class="app">

<aside class="sidebar">
  <div class="brand">
    <div class="brand-mark"><img src="/img/logo.png" alt="" /></div>
    </div>
  <nav class="nav">
    <a href="/home" class="active">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a2 2 0 0 1-2 2h-4v-7H9v7H5a2 2 0 0 1-2-2v-9z"/></svg>
      Home
    </a>
    <a href="/devices">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="14" height="10" rx="1.5"/><path d="M7 19h6M10 15v4"/><rect x="17" y="9" width="5" height="11" rx="1"/></svg>
      Devices
    </a>
    <a href="/reports">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M8 15v-4M12 15V8M16 15v-6"/></svg>
      Activity
    </a>
    <div class="nav-section">Family</div>
    <div data-fill="family-nav"></div>
  </nav>
  <div class="sidebar-footer">
    <strong>Running on this PC</strong>
    Local-only · no cloud
  </div>
</aside>

<main class="main">
  <div class="page-head">
    <div>
      <div class="greeting" data-fill="greeting">Loading…</div>
      <h1 data-fill="hero-title">Welcome to Hearth</h1>
    </div>
    <div class="page-actions">
      <a class="btn" href="/devices">Manage devices</a>
      <a class="btn btn-primary" href="/first-run">Add a child</a>
    </div>
  </div>

  <section class="today" aria-label="Today at a glance" data-fill="today-strip">
    <div><span class="label">Within limits</span><span class="value">—</span><span class="sub">loading…</span></div>
    <div><span class="label">Active devices</span><span class="value">—</span><span class="sub">loading…</span></div>
    <div><span class="label">Blocks today</span><span class="value">—</span><span class="sub">loading…</span></div>
    <div><span class="label">Capability gaps</span><span class="value">—</span><span class="sub">loading…</span></div>
  </section>

  <section class="child-grid" data-fill="child-cards"></section>

  <section class="discovered">
    <div class="discovered-head">
      <h2>Devices waiting to be set up</h2>
      <span class="muted" data-fill="discovered-count">scanning…</span>
    </div>
    <div class="discovered-list" data-fill="discovered-list"></div>
    </section>
</main>

</div>
<script src="/js/app.js"></script>
<script src="/js/home.js"></script>
</body>
</html>
