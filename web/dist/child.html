<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Maya — Hearth</title>
<link rel="stylesheet" href="/css/app.css" />
<style>
  /* Child header */
  .child-hero {
    display: flex; gap: 20px; align-items: center;
    margin-bottom: 32px;
  }
  .child-hero .avatar { width: 64px; height: 64px; font-size: 22px; }
  .child-hero h1 { font-size: 28px; }
  .child-hero .meta { color: var(--muted); font-size: 13.5px; display: flex; gap: 12px; margin-top: 4px; }
  .child-hero .meta span:not(:last-child)::after { content: "·"; margin-left: 12px; color: var(--muted-2); }
  .child-hero .actions { margin-left: auto; display: flex; gap: 8px; }

  /* Two-column layout */
  .child-cols {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 24px;
  }
  @media (max-width: 1100px) { .child-cols { grid-template-columns: 1fr; } }

  /* Today block */
  .today-card { padding: 24px; }
  .today-card .row-top {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 16px;
  }
  .today-card h3 { font-size: 15px; color: var(--muted); font-weight: 500; }
  .today-card .big {
    font-family: var(--font-display);
    font-size: 40px;
    font-weight: 600;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .today-card .big .of { color: var(--muted-2); font-weight: 500; font-size: 24px; }
  .today-card .bar { height: 8px; margin-top: 6px; }
  .today-card .bar-meta {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--muted);
    margin-top: 8px;
  }
  .today-card .now {
    margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border);
    display: flex; gap: 10px; align-items: flex-start;
  }
  .today-card .now-icon {
    width: 28px; height: 28px; border-radius: 8px;
    background: var(--accent-soft); color: var(--accent-ink);
    display: grid; place-items: center; flex-shrink: 0;
  }
  .today-card .now-text strong { display: block; font-size: 13.5px; font-weight: 600; }
  .today-card .now-text span { color: var(--muted); font-size: 12.5px; }

  /* Devices list (compact) */
  .dev-list { display: flex; flex-direction: column; }
  .dev-row {
    display: grid;
    grid-template-columns: 36px 1fr auto auto;
    gap: 14px;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }
  .dev-row:last-child { border-bottom: none; }
  .dev-icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--surface-2); color: var(--muted);
    display: grid; place-items: center;
  }
  .dev-name { font-size: 14px; font-weight: 600; }
  .dev-sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .dev-actions { display: flex; gap: 6px; }
  .control-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 6px;
    font-weight: 500;
  }
  .control-badge.full { background: var(--accent-soft); color: var(--accent-ink); }
  .control-badge.net  { background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }

  /* Policy summary */
  .policy-block {
    padding: 16px 0;
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: 100px 1fr auto;
    gap: 16px;
    align-items: flex-start;
  }
  .policy-block:first-child { border-top: none; padding-top: 0; }
  .policy-block .p-label {
    font-size: 12px; font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.04em; text-transform: uppercase;
    padding-top: 2px;
  }
  .policy-block .p-text { font-size: 14px; line-height: 1.5; }
  .policy-block .p-text .em { color: var(--fg); font-weight: 500; }

  /* Right column — quick facts */
  .qf {
    display: flex; flex-direction: column;
    padding: 0;
  }
  .qf-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .qf-row:last-child { border-bottom: none; }
  .qf-label { color: var(--muted); }
  .qf-value { font-weight: 500; }

  .mini-chart {
    height: 64px;
    display: flex; align-items: flex-end;
    gap: 3px;
    padding-top: 8px;
  }
  .mini-chart > div {
    flex: 1;
    background: var(--accent-soft);
    border-radius: 2px;
  }
  .mini-chart > div.today { background: var(--accent); }
  .mini-chart-labels {
    display: flex; justify-content: space-between;
    font-size: 10.5px; color: var(--muted-2);
    margin-top: 4px;
    font-family: var(--font-mono);
    letter-spacing: 0.04em;
  }
</style>
  <link rel="icon" type="image/png" href="/img/logo.png" />
</head>
<body>
<div class="app">

<aside class="sidebar">
  <div class="brand"><div class="brand-mark"><img src="/img/logo.png" alt="" /></div></div>
  <nav class="nav">
    <a href="/home">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a2 2 0 0 1-2 2h-4v-7H9v7H5a2 2 0 0 1-2-2v-9z"/></svg>
      Home
    </a>
    <a href="/devices">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="14" height="10" rx="1.5"/><path d="M7 19h6M10 15v4"/><rect x="17" y="9" width="5" height="11" rx="1"/></svg>
      Devices
    </a>
    <a href="/reports">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16M8 15v-4M12 15V8M16 15v-6"/></svg>
      Activity
    </a>
    <div class="nav-section">Family</div>
    <div data-fill="family-nav"></div>
  </nav>
  <div class="sidebar-footer"><strong>Running on this PC</strong>Local-only · no cloud</div>
</aside>

<main class="main">

  <div class="child-hero" data-fill="child-hero"><div class="muted">Loading…</div></div>

  <div class="child-cols" data-fill="child-cols"></div>
</main>

</div>
<script src="/js/app.js"></script>
<script src="/js/child.js"></script>
</body>
</html>
